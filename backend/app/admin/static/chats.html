<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thetavas Chats</title>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; color: #111b21; height: 100vh; overflow: hidden; }
    #app { display: flex; height: 100vh; }

    #thread-list-pane { width: 320px; flex-shrink: 0; background: #fff;
      border-right: 1px solid #e9edef; display: flex; flex-direction: column; }
    #thread-list-header { background: #00a884; color: #fff; padding: .9rem 1rem;
      font-size: 1.05rem; font-weight: 600; display: flex; justify-content: space-between;
      align-items: center; }
    #thread-list-header button { background: rgba(255,255,255,.18); color: #fff; border: none;
      border-radius: 6px; padding: .3rem .7rem; font-size: .78rem; cursor: pointer; }
    #thread-search { border: none; border-bottom: 1px solid #e9edef; padding: .6rem 1rem;
      font-size: .82rem; outline: none; }
    #thread-list { flex: 1; overflow-y: auto; }
    #load-older-btn { flex-shrink: 0; width: 100%; border: none; border-top: 1px solid #e9edef;
      background: #f0f2f5; color: #3b4a54; padding: .6rem 1rem; font-size: .8rem; cursor: pointer; }
    #load-older-btn:hover:not(:disabled) { background: #e9edef; }
    #load-older-btn:disabled { cursor: default; color: #8696a0; }
    .thread-row { padding: .7rem 1rem; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
    .thread-row:hover { background: #f5f6f6; }
    .thread-row.active { background: #f0f2f5; }
    .thread-row .phone { font-weight: 600; font-size: .88rem; }
    .thread-row .preview { font-size: .78rem; color: #667781; margin-top: .15rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-row .ts { font-size: .68rem; color: #8696a0; float: right; }

    #thread-filters { display: flex; flex-wrap: wrap; gap: .4rem; padding: .5rem 1rem; border-bottom: 1px solid #f0f2f5; }
    .filter-chip { font-size: .76rem; padding: .28rem .7rem; border-radius: 999px; cursor: pointer;
      background: #f0f2f5; color: #3b4a54; border: none; white-space: nowrap; }
    .filter-chip.active { background: #00a884; color: #fff; }
    .unread-badge { display: inline-block; min-width: 1.1rem; height: 1.1rem; line-height: 1.1rem;
      text-align: center; border-radius: 999px; background: #00a884; color: #fff;
      font-size: .68rem; font-weight: 600; margin-left: .4rem; padding: 0 .3rem; }

    #chat-pane { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
    #chat-header { background: #f0f2f5; padding: .8rem 1.2rem; font-weight: 600;
      border-bottom: 1px solid #e9edef; min-height: 2.2rem;
      display: flex; align-items: center; justify-content: space-between; }
    #resume-ai-btn { background: #00a884; color: #fff; border: none; border-radius: 6px;
      padding: .35rem .8rem; font-size: .78rem; cursor: pointer; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; display: flex;
      flex-direction: column; gap: .5rem; }
    .bubble { padding: .45rem .7rem; border-radius: 8px; max-width: 65%; font-size: .85rem;
      word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
    .bubble-in { background: #fff; align-self: flex-start; }
    .bubble-out { background: #d9fdd3; align-self: flex-end; }
    .bubble-label { font-size: .65rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .03em; color: #667781; margin-bottom: .15rem; }
    .bubble-ts { font-size: .65rem; color: #8696a0; margin-top: .2rem; text-align: right; }
    .bubble-status { font-size: .68rem; color: #8696a0; margin-top: .15rem; }
    .bubble-status-error { color: #dc2626; }
    .bubble-image { max-width: 240px; border-radius: 8px; display: block; margin-top: 4px; }
    .date-divider { align-self: center; background: #d9d3c5; color: #3b4a54;
      font-size: .68rem; padding: .2rem .6rem; border-radius: 8px; margin: .2rem 0; }
    .delivery-mark { margin-left: .3rem; font-size: .7rem; font-weight: 700; }
    .delivery-mark-sent, .delivery-mark-delivered { color: #8696a0; }
    .delivery-mark-read { color: #53bdeb; }
    .delivery-mark-failed { color: #dc2626; font-weight: 700; }
    .delivery-mark-processing { color: #8696a0; }
    #chat-empty { display: flex; align-items: center; justify-content: center; flex: 1;
      color: #667781; font-size: .9rem; }
    #reply-bar { display: flex; gap: .5rem; padding: .6rem 1.2rem; background: #f0f2f5;
      border-top: 1px solid #e9edef; position: relative; }
    #reply-input { flex: 1; padding: .5rem .7rem; border: 1px solid #d1d7db; border-radius: 8px;
      font-size: .85rem; outline: none; }
    #reply-input:disabled { background: #e9edef; color: #8696a0; }
    #reply-send-btn { background: #00a884; color: #fff; border: none; border-radius: 6px;
      padding: .5rem 1.1rem; font-size: .82rem; cursor: pointer; }
    #reply-send-btn:disabled { background: #8696a0; cursor: not-allowed; }
    #reply-status { padding: 0 1.2rem .3rem; min-height: 1em; }
    #emoji-btn, #template-btn { background: none; border: none; font-size: 1.3rem;
      cursor: pointer; padding: .2rem .4rem; }
    #emoji-popup { position: absolute; bottom: calc(100% + .4rem); left: 0;
      width: max-content; max-width: calc(100% - 1rem); background: #fff;
      border: 1px solid #d1d7db; border-radius: 8px; padding: .5rem; box-shadow: 0 2px 8px rgba(0,0,0,.15);
      display: grid; grid-template-columns: repeat(8, 1fr); gap: .2rem; z-index: 10; }
    #emoji-popup button { background: none; border: none; font-size: 1.15rem; cursor: pointer;
      padding: .2rem; border-radius: 4px; }
    #emoji-popup button:hover { background: #f0f2f5; }
    #template-dialog { position: fixed; inset: 0; background: rgba(0,0,0,.35);
      display: flex; align-items: center; justify-content: center; z-index: 20; }
    #template-dialog-inner { background: #fff; border-radius: 10px; width: 420px; max-height: 80vh;
      overflow-y: auto; padding: 1rem; }
    #template-dialog-header { display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; margin-bottom: .7rem; }
    #template-dialog-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; }
    .template-order-heading, .template-pick-heading { font-size: .82rem; font-weight: 600;
      color: #667781; margin: .6rem 0 .4rem; }
    .template-order-select { width: 100%; padding: .45rem .5rem; border: 1px solid #d1d7db;
      border-radius: 6px; font-size: .85rem; background: #fff; margin-bottom: .6rem; }
    .template-pick-list { font-size: .85rem; }
    .template-pick-row { padding: .5rem .6rem; border: 1px solid #e9edef; border-radius: 6px;
      margin-bottom: .4rem; cursor: pointer; font-size: .85rem; }
    .template-pick-row:hover { background: #f5f6f6; }
    .template-field-row { margin-bottom: .5rem; }
    .template-field-row label { display: block; font-size: .75rem; color: #667781;
      margin-bottom: .2rem; }
    .template-field-row input { width: 100%; padding: .4rem .5rem; border: 1px solid #d1d7db;
      border-radius: 6px; font-size: .82rem; }
    #template-send-btn { background: #00a884; color: #fff; border: none; border-radius: 6px;
      padding: .5rem 1rem; font-size: .82rem; cursor: pointer; margin-top: .5rem; }
    #template-send-btn:disabled { background: #8fd3c4; cursor: default; }
    .template-status { margin-top: .5rem; font-size: .78rem; color: #b00020; white-space: pre-wrap; }
    .template-field-row input:disabled { background: #f0f2f5; color: #667781; }

    #order-panel { width: 300px; flex-shrink: 0; background: #fff; border-left: 1px solid #e9edef;
      padding: 1rem; overflow-y: auto; }
    #order-panel h3 { font-size: .9rem; margin-bottom: .6rem; }
    #order-select { width: 100%; padding: .4rem .5rem; border: 1px solid #d1d7db;
      border-radius: 6px; font-size: .82rem; margin-bottom: .8rem; }
    .order-field { font-size: .8rem; color: #3b4a54; margin-bottom: .4rem; }
    .order-field .label { color: #667781; }
    #order-empty { font-size: .82rem; color: #667781; }
    #order-number { font-size: .95rem; font-weight: 700; margin-bottom: .5rem; }
    #order-customer, #order-products, #order-detail, #order-exchange { margin-top: .6rem;
      border-top: 1px solid #e9edef; padding-top: .6rem; }
    #order-customer h4, #order-products h4, #order-detail h4, #order-exchange h4 {
      font-size: .78rem; color: #667781; margin-bottom: .4rem; }
    .product-row { font-size: .78rem; color: #3b4a54; margin-bottom: .3rem; }
    .exchange-status-select, .exchange-tracking-input { display: block; width: 100%;
      padding: .4rem .5rem; border: 1px solid #d1d7db; border-radius: 6px; font-size: .8rem;
      margin-bottom: .4rem; background: #fff; }
    .exchange-save-btn { background: #00a884; color: #fff; border: none; border-radius: 6px;
      padding: .5rem 1rem; font-size: .82rem; cursor: pointer; margin-top: .5rem; }
    .exchange-save-btn:disabled { background: #8fd3c4; cursor: default; }
    .exchange-status-msg { margin-top: .5rem; font-size: .78rem; color: #b00020;
      white-space: pre-wrap; }

    .status { font-size: .78rem; padding: .3rem 1rem; color: #dc2626; }
  </style>
</head>
<body>
  <div id="app">
    <div id="thread-list-pane">
      <div id="thread-list-header">
        <span>Chats</span>
        <button id="refresh-btn">Refresh</button>
      </div>
      <input id="thread-search" type="text" placeholder="Search name, phone, or order #" />
      <div id="thread-filters"></div>
      <div id="thread-list"></div>
      <button id="load-older-btn" style="display:none">Load older chats</button>
      <div class="status" id="list-status"></div>
    </div>
    <div id="chat-pane">
      <div id="chat-header">
        <span id="chat-header-phone"></span>
        <button id="resume-ai-btn" style="display:none">Resume AI</button>
      </div>
      <div id="chat-messages"><div id="chat-empty">Select a chat to view it</div></div>
      <div class="status" id="thread-status"></div>
      <div id="reply-bar">
        <button id="emoji-btn" type="button" title="Emoji">😊</button>
        <button id="template-btn" type="button" title="Send a template">📋</button>
        <input id="reply-input" type="text" placeholder="Type a message" />
        <button id="reply-send-btn">Send</button>
        <div id="emoji-popup" style="display:none"></div>
      </div>
      <div id="template-dialog" style="display:none">
        <div id="template-dialog-inner">
          <div id="template-dialog-header">
            <span>Send a Template</span>
            <button id="template-dialog-close" type="button">×</button>
          </div>
          <div id="template-dialog-body"></div>
        </div>
      </div>
      <div class="status" id="reply-status"></div>
    </div>
    <div id="order-panel">
      <h3>Order Details</h3>
      <div id="order-empty">No orders for this customer</div>
      <select id="order-select" style="display:none"></select>
      <div id="order-number"></div>
      <div id="order-customer"></div>
      <div id="order-products"></div>
      <div id="order-detail"></div>
      <div id="order-exchange" style="display:none"></div>
    </div>
  </div>
  <script src="chats.js"></script>
</body>
</html>
