[project]
name = "thetavas-order-bot"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps only — Vercel's uv builder installs these from [project].dependencies.
# Keep in sync with requirements.txt (used for local pip installs). Dev tools live in
# [dependency-groups] below so they are NOT shipped to the serverless function.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42",
    "asyncpg>=0.29",
    "slowapi>=0.1.9",
    "litellm>=1.89,<2",
    "google-auth>=2.41",  # required by litellm for Vertex AI service-account auth
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

# No [build-system] → uv treats this as a virtual project: it resolves/installs the
# dependencies but never tries to build/install our code as a package (the app is imported
# from the source tree via api/index.py). Explicit for clarity across uv versions.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "slowapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
